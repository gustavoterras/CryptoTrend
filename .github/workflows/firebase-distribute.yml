name: Firebase App Distribution (Manual)

on:
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Ensure google-services.json exists
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        elif [ ! -f "app/google-services.json" ]; then
          cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "942204810323",
    "project_id": "gen-lang-client-0249381564",
    "storage_bucket": "gen-lang-client-0249381564.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:942204810323:android:ef2eb8ae55a51e16fdc2a6",
        "android_client_info": {
          "package_name": "br.com.terras.app.cryptotrend"
        }
      },
      "oauth_client": [
        {
          "client_id": "942204810323-ooom9eeh8cvbq8ergc0t8m3u6qglhko4.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "br.com.terras.app.cryptotrend",
            "certificate_hash": "0d7395b13478ed0364b4f63aa9ae6c5dd0186d49"
          }
        },
        {
          "client_id": "942204810323-r0s178g2ccu8qvdtndk2jos22lflbnvv.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyCJpEAIeV3s-SasmWDe930vXV82jImawQE"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "942204810323-r0s178g2ccu8qvdtndk2jos22lflbnvv.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
        fi

    - name: Build Release APK
      env:
        GRADLE_OPTS: "-Dnet.bytebuddy.experimental=true -XX:+EnableDynamicAgentLoading -Djdk.attach.allowAttachSelf=true"
      run: ./gradlew assembleRelease

    - name: Upload APK to Firebase App Distribution
      if: env.GCP_SA_KEY != '' || env.FIREBASE_TOKEN != ''
      uses: w9jds/firebase-action@v11.16.0
      with:
        args: appdistribution:distribute app/build/outputs/apk/release/app-release-unsigned.apk --app 1:942204810323:android:ef2eb8ae55a51e16fdc2a6 --groups "testers" --release-notes "Deploy manual executado via GitHub Actions (workflow_dispatch)"
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
