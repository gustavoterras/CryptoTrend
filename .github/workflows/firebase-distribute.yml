name: Firebase App Distribution (Manual)

on:
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Release APK
      env:
        GRADLE_OPTS: "-Dnet.bytebuddy.experimental=true -XX:+EnableDynamicAgentLoading -Djdk.attach.allowAttachSelf=true"
      run: ./gradlew assembleRelease

    - name: Upload APK to Firebase App Distribution
      if: env.GCP_SA_KEY != '' || env.FIREBASE_TOKEN != ''
      uses: w9jds/firebase-action@v11.16.0
      with:
        args: appdistribution:distribute app/build/outputs/apk/release/app-release-unsigned.apk --app 1:942204810323:android:ef2eb8ae55a51e16fdc2a6 --groups "testers" --release-notes "Deploy manual executado via GitHub Actions (workflow_dispatch)"
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
