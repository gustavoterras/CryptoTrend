name: Firebase App Distribution (Manual)

on:
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Ensure google-services.json exists
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        elif [ ! -f "app/google-services.json" ]; then
          echo "" | base64 -d > app/google-services.json
        fi

    - name: Build Debug APK
      env:
        GRADLE_OPTS: "-Dnet.bytebuddy.experimental=true -XX:+EnableDynamicAgentLoading -Djdk.attach.allowAttachSelf=true"
      run: ./gradlew assembleDebug

    - name: Upload APK to Firebase App Distribution
      if: env.GCP_SA_KEY != '' || env.FIREBASE_TOKEN != ''
      uses: w9jds/firebase-action@v11.16.0
      with:
        args: appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app 1:942204810323:android:ef2eb8ae55a51e16fdc2a6 --groups "testers" --release-notes "Deploy manual executado via GitHub Actions (workflow_dispatch)" --non-interactive
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
