name: Firebase App Distribution

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notas da versão (vazio usa a mensagem do último commit)'
        required: false
        default: ''
      tester_groups:
        description: 'Grupos de testadores no Firebase (ex: testers, qa)'
        required: false
        default: ''
      testers:
        description: 'E-mails dos testadores separados por vírgula (opcional)'
        required: false
        default: ''
      run_tests:
        description: 'Executar testes unitários antes de distribuir'
        required: false
        type: boolean
        default: true

concurrency:
  group: firebase-distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GRADLE_OPTS: "-Dnet.bytebuddy.experimental=true -XX:+EnableDynamicAgentLoading -Djdk.attach.allowAttachSelf=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Ensure google-services.json exists
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "" | base64 -d > app/google-services.json
          fi

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "" | base64 -d > debug.keystore
            fi
          fi

      - name: Run Unit Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Workflow Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoTrend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Validate Firebase Credentials
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY || secrets.GCP_SA_KEY || secrets.FIREBASE_CREDENTIALS || secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$GCP_SA_KEY" ] && [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error title=Credenciais do Firebase ausentes::Configure o secret FIREBASE_SERVICE_ACCOUNT_KEY (ou FIREBASE_TOKEN) em Settings > Secrets and variables > Actions no GitHub."
            echo "=========================================================================="
            echo "COMO CONFIGURAR:"
            echo "1. No Google Cloud / Firebase Console (projeto gen-lang-client-0249381564):"
            echo "   Crie uma Service Account com o papel 'Firebase App Distribution Admin' (Administrador do Firebase App Distribution)"
            echo "   e gere a chave JSON."
            echo "2. No GitHub do repositório:"
            echo "   Acesse Settings > Secrets and variables > Actions > New repository secret."
            echo "   Crie o secret FIREBASE_SERVICE_ACCOUNT_KEY com o conteúdo do JSON."
            echo "=========================================================================="
            exit 1
          fi

      - name: Distribute APK to Firebase App Distribution
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY || secrets.GCP_SA_KEY || secrets.FIREBASE_CREDENTIALS || secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          RAW_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
          INPUT_TESTER_GROUPS: ${{ github.event.inputs.tester_groups || '' }}
          INPUT_TESTERS: ${{ github.event.inputs.testers || '' }}
          VAR_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || '' }}
          VAR_TESTERS: ${{ vars.FIREBASE_TESTERS || '' }}
        run: |
          if [ -n "$INPUT_RELEASE_NOTES" ]; then
            export FIREBASE_RELEASE_NOTES="$INPUT_RELEASE_NOTES"
          else
            COMMIT_SUBJECT="$(git log -1 --pretty=%s 2>/dev/null || echo 'Build automatizado')"
            SHORT_SHA="${GITHUB_SHA::7}"
            export FIREBASE_RELEASE_NOTES="CryptoTrend (${GITHUB_REF_NAME}@${SHORT_SHA}): ${COMMIT_SUBJECT}"
          fi

          export FIREBASE_TESTER_GROUPS="${INPUT_TESTER_GROUPS:-$VAR_TESTER_GROUPS}"
          export FIREBASE_TESTERS="${INPUT_TESTERS:-$VAR_TESTERS}"
          export FIREBASE_ARTIFACT_TYPE="APK"

          CRED_FILE="$RUNNER_TEMP/firebase_credentials.json"
          if [ -n "$GCP_SA_KEY" ]; then
            printf '%s' "$GCP_SA_KEY" > "$CRED_FILE"
            chmod 600 "$CRED_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$CRED_FILE"
            unset FIREBASE_TOKEN
            echo "Usando Service Account em $CRED_FILE"
          elif [ -n "$RAW_FIREBASE_TOKEN" ]; then
            export FIREBASE_TOKEN="$RAW_FIREBASE_TOKEN"
            echo "Usando FIREBASE_TOKEN"
          fi

          echo ">>> Enviando APK via plugin oficial do Firebase App Distribution (Gradle)..."
          if ! ./gradlew appDistributionUploadDebug --no-daemon --info; then
            echo ">>> Fallback: enviando APK via Firebase CLI..."
            CLI_ARGS=(
              firebase-tools appdistribution:distribute
              "app/build/outputs/apk/debug/app-debug.apk"
              --app "1:942204810323:android:ef2eb8ae55a51e16fdc2a6"
              --project "gen-lang-client-0249381564"
              --release-notes "$FIREBASE_RELEASE_NOTES"
            )
            if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
              CLI_ARGS+=(--groups "$FIREBASE_TESTER_GROUPS")
            fi
            if [ -n "$FIREBASE_TESTERS" ]; then
              CLI_ARGS+=(--testers "$FIREBASE_TESTERS")
            fi
            npx --yes "${CLI_ARGS[@]}" --debug
          fi

      - name: Cleanup Temporary Credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase_credentials.json"
