name: Firebase App Distribution (Manual)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notas da versão'
        required: false
        default: 'Deploy manual executado via GitHub Actions'
      tester_groups:
        description: 'Grupos de testadores (ex: testers, qa)'
        required: false
        default: 'testers'

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Ensure google-services.json exists
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        elif [ ! -f "app/google-services.json" ]; then
          echo "" | base64 -d > app/google-services.json
        fi

    - name: Ensure debug.keystore exists
      run: |
        if [ ! -f "debug.keystore" ]; then
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "" | base64 -d > debug.keystore
          fi
        fi

    - name: Build Debug APK
      env:
        GRADLE_OPTS: "-Dnet.bytebuddy.experimental=true -XX:+EnableDynamicAgentLoading -Djdk.attach.allowAttachSelf=true"
      run: ./gradlew assembleDebug

    - name: Upload APK to Firebase App Distribution
      uses: w9jds/firebase-action@v11.16.0
      with:
        args: appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app 1:942204810323:android:ef2eb8ae55a51e16fdc2a6 --project gen-lang-client-0249381564 --groups "${{ github.event.inputs.tester_groups || 'testers' }}" --release-notes "${{ github.event.inputs.release_notes || 'Deploy manual executado via GitHub Actions' }}" --debug
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY || secrets.GCP_SA_KEY || secrets.FIREBASE_CREDENTIALS || secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    - name: Upload APK as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
