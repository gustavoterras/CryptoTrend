name: Android CI

on:
  push:
    branches: 
      - master
      - work/**/*
  # pull_request:
  #   branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Ensure google-services.json exists
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ ! -f "app/google-services.json" ]; then
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "942204810323",
    "project_id": "gen-lang-client-0249381564",
    "storage_bucket": "gen-lang-client-0249381564.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:942204810323:android:ef2eb8ae55a51e16fdc2a6",
        "android_client_info": {
          "package_name": "br.com.terras.app.cryptotrend"
        }
      },
      "oauth_client": [
        {
          "client_id": "942204810323-ooom9eeh8cvbq8ergc0t8m3u6qglhko4.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "br.com.terras.app.cryptotrend",
            "certificate_hash": "0d7395b13478ed0364b4f63aa9ae6c5dd0186d49"
          }
        },
        {
          "client_id": "942204810323-r0s178g2ccu8qvdtndk2jos22lflbnvv.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyCJpEAIeV3s-SasmWDe930vXV82jImawQE"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "942204810323-r0s178g2ccu8qvdtndk2jos22lflbnvv.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi
        fi
      
    - name: Build
      env:
        GRADLE_OPTS: "-Dnet.bytebuddy.experimental=true -XX:+EnableDynamicAgentLoading -Djdk.attach.allowAttachSelf=true"
      run: ./gradlew build

    - name: Run Tests
      env:
        GRADLE_OPTS: "-Dnet.bytebuddy.experimental=true -XX:+EnableDynamicAgentLoading -Djdk.attach.allowAttachSelf=true"
      run: ./gradlew test -x koverXmlReportDebug

    - name: Run Coverage
      env:
        GRADLE_OPTS: "-Dnet.bytebuddy.experimental=true -XX:+EnableDynamicAgentLoading -Djdk.attach.allowAttachSelf=true"
      run: ./gradlew koverXmlReportDebug
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        slug: gustavoterras/CryptoTrend
        fail_ci_if_error: true # optional (default = false)
        files: app/build/reports/kover/reportDebug.xml # optional
        flags: unittests # optional
        name: codecov-umbrella # optional
        token: ${{ secrets.CODECOV_TOKEN }} # required
        verbose: true # optional (default = false)

    # - name: SonarCloud Scan
    #   uses: sonarsource/sonarcloud-github-action@v2.3.0
    #   env:
    #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Upload test report
      uses: actions/upload-artifact@v6
      with:
        name: reportDebug.xml
        path: app/build/reports/kover/reportDebug.xml

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v6
      with:
        name: CryptoTrend.apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK to Firebase App Distribution
      if: env.GCP_SA_KEY != '' || env.FIREBASE_TOKEN != ''
      uses: w9jds/firebase-action@v11.16.0
      with:
        args: appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app 1:942204810323:android:ef2eb8ae55a51e16fdc2a6 --groups "testers" --release-notes "Build automático via GitHub Actions CI"
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
