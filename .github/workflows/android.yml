name: Android CI

on:
  push:
    branches: 
      - master
      - main
      - work/**/*
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Ensure google-services.json exists
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        elif [ ! -f "app/google-services.json" ]; then
          echo "" | base64 -d > app/google-services.json
        fi
      
    - name: Build APK and Run Tests with Coverage
      env:
        GRADLE_OPTS: "-Dnet.bytebuddy.experimental=true -XX:+EnableDynamicAgentLoading -Djdk.attach.allowAttachSelf=true"
      run: ./gradlew assembleDebug koverXmlReportDebug --no-daemon
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        slug: gustavoterras/CryptoTrend
        fail_ci_if_error: false # optional (default = false)
        files: app/build/reports/kover/reportDebug.xml # optional
        flags: unittests # optional
        name: codecov-umbrella # optional
        token: ${{ secrets.CODECOV_TOKEN }} # required
        verbose: true # optional (default = false)

    # - name: SonarCloud Scan
    #   uses: sonarsource/sonarcloud-github-action@v2.3.0
    #   env:
    #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: reportDebug.xml
        path: app/build/reports/kover/reportDebug.xml

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CryptoTrend.apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK to Firebase App Distribution
      if: env.GCP_SA_KEY != '' || env.FIREBASE_TOKEN != ''
      uses: w9jds/firebase-action@v11.16.0
      with:
        args: appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app 1:942204810323:android:ef2eb8ae55a51e16fdc2a6 --groups "testers" --release-notes "Build automático via GitHub Actions CI" --non-interactive
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
